claims:
- id: C01
  text: P0300 là mã lỗi chuẩn (generic) nghĩa là phát hiện bỏ máy ngẫu nhiên/nhiều xi-lanh (Random/Multiple Cylinder Misfire Detected).
  category: dtc-definition
  sources:
  - SRC01
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: Kiểm chứng định nghĩa trong SAE J2012 / ISO 15031-6.
- id: C02
  text: Các mã P0301-P0312 chỉ hiện tượng bỏ máy được phát hiện ở xi-lanh số 1-12.
  category: dtc-definition
  sources:
  - SRC01
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: Kiểm chứng trong SAE J2012.
- id: C03
  text: Dữ liệu đóng băng (freeze frame) ghi lại điều kiện vận hành tại thời điểm mã lỗi được lưu.
  category: obd-standard
  sources:
  - SRC02
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: Kiểm chứng phạm vi dữ liệu trong SAE J1979.
- id: C04
  text: Xóa mã lỗi chỉ xóa mã và dữ liệu chẩn đoán liên quan, đặt lại trạng thái sẵn sàng; không sửa nguyên nhân, lỗi sẽ quay lại nếu nguyên nhân còn.
  category: obd-standard
  sources:
  - SRC02
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: Kiểm chứng danh sách dữ liệu bị xóa trong SAE J1979.
- id: C05
  text: 'Nhóm nguyên nhân cần kiểm tra khi có P0300: đánh lửa, nhiên liệu, khí nạp (rò chân không), cơ khí (áp suất nén), cảm biến; mỗi nhóm có phép thử xác nhận riêng.'
  category: diagnostic-procedure
  sources: []
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: 'Chưa có nguồn: cần tài liệu hãng hoặc giáo trình.'
- id: C06
  text: Đèn báo lỗi động cơ nhấp nháy khi mức bỏ máy đủ để làm hỏng bộ xúc tác; cần giảm tải và dừng xe an toàn.
  category: safety
  sources:
  - SRC03
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: Kiểm chứng yêu cầu nhấp nháy đèn trong 13 CCR 1968.2 và tài liệu hãng.
