claims:
- id: C01
  text: P0300 cho biết ECU đã phát hiện bỏ máy ngẫu nhiên hoặc ở nhiều xi-lanh (Random/Multiple Cylinder Misfire Detected); bản thân mã này không chỉ ra nguyên nhân gây bỏ máy.
  category: dtc-definition
  sources: []
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: 'No source read: WebFetch to ww2.arb.ca.gov and www.law.cornell.edu failed on 2026-11-06 (host not allowed by the session network policy). Needs SAE J2012 / ISO 15031-6 (paywalled) or public OEM service information defining P0300.'
- id: C02
  text: Các mã P0301 đến P0312 cho biết ECU phát hiện bỏ máy ở một xi-lanh cụ thể; hai số cuối là số thứ tự xi-lanh, ví dụ P0301 là xi-lanh số 1.
  category: dtc-definition
  sources: []
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: 'No source read: WebFetch to ww2.arb.ca.gov and www.law.cornell.edu failed on 2026-11-06 (host not allowed by the session network policy). Needs SAE J2012 / ISO 15031-6 or OEM service information. Cylinder numbering order is engine-specific (OEM).'
- id: C03
  text: Freeze frame là bản ghi các thông số động cơ (ví dụ tốc độ động cơ, tải, nhiệt độ nước làm mát, trạng thái điều khiển nhiên liệu) tại thời điểm ECU lưu mã lỗi, giúp biết lỗi xảy ra trong điều kiện vận hành nào.
  category: obd-standard
  sources: []
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: 'No source read: WebFetch to ww2.arb.ca.gov and www.law.cornell.edu failed on 2026-11-06 (host not allowed by the session network policy). Needs SAE J1979 Service $02 description or CARB 13 CCR 1968.2 freeze-frame requirements. The exact parameter list is not yet confirmed; keep the ''ví dụ'' list until a source is read.'
- id: C04
  text: Xóa mã lỗi bằng máy chẩn đoán (Service $04) đồng thời xóa dữ liệu freeze frame và đặt lại trạng thái readiness của các monitor, nên làm mất bằng chứng chẩn đoán.
  category: obd-standard
  sources: []
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: 'No source read: WebFetch to ww2.arb.ca.gov and www.law.cornell.edu failed on 2026-11-06 (host not allowed by the session network policy). Needs SAE J1979 Service $04 description or CARB 13 CCR 1968.2 erase requirements.'
- id: C05
  text: 'Xóa mã lỗi không sửa được nguyên nhân bỏ máy: nếu nguyên nhân còn, ECU sẽ phát hiện lại và ghi lại mã khi xe vận hành lại trong điều kiện tương tự.'
  category: obd-standard
  sources: []
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: 'No source read: WebFetch to ww2.arb.ca.gov and www.law.cornell.edu failed on 2026-11-06 (host not allowed by the session network policy). Needs CARB 13 CCR 1968.2 / 40 CFR 86.1806 misfire monitoring text or OEM service information. Time to re-detection varies by vehicle and drive cycle; do not state a number.'
- id: C06
  text: Trên xe được chứng nhận theo quy định OBD-II của Mỹ, đèn báo lỗi động cơ (MIL) nhấp nháy khi ECU phát hiện mức bỏ máy có thể làm hỏng bộ xúc tác.
  category: obd-standard
  sources: []
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: 'No source read: WebFetch to ww2.arb.ca.gov and www.law.cornell.edu failed on 2026-11-06 (host not allowed by the session network policy). Unread leads: 40 CFR 86.099-17 (2004 edition, webarchive.library.unt.edu) and older CARB OBD II drafts on arb.ca.gov. Search-result summaries mention blinking once per second and a fuel-shutoff exception; not read, so not used.'
- id: C07
  text: Khi đèn check engine nhấp nháy, nên giảm tải, hạn chế chạy xe và kiểm tra sớm, vì tiếp tục vận hành khi bỏ máy nặng có thể làm bộ xúc tác quá nhiệt và hư hỏng.
  category: safety
  sources: []
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: 'No source read: WebFetch to ww2.arb.ca.gov and www.law.cornell.edu failed on 2026-11-06 (host not allowed by the session network policy). Needs OEM owner''s/service information or regulation text. Wording of the recommended action must follow the source once read.'
- id: C08
  text: Nguyên nhân khả dĩ của P0300 gồm các nhóm đánh lửa, nhiên liệu, rò rỉ khí nạp/chân không và cơ khí (độ nén); mỗi nhóm cần một phép kiểm tra xác nhận trước khi thay phụ tùng.
  category: diagnostic-procedure
  sources: []
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: 'No source read: WebFetch to ww2.arb.ca.gov and www.law.cornell.edu failed on 2026-11-06 (host not allowed by the session network policy). Needs OEM misfire diagnostic procedure or textbook. Which groups are ''common'' is not claimed.'
- id: C09
  text: Với nhóm đánh lửa và nhiên liệu, kiểm tra theo quy trình của hãng cho xe cụ thể (ví dụ kiểm tra bô-bin/bugi, đo áp suất nhiên liệu, kiểm tra kim phun) trước khi kết luận và thay thế.
  category: diagnostic-procedure
  sources: []
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: 'No source read: WebFetch to ww2.arb.ca.gov and www.law.cornell.edu failed on 2026-11-06 (host not allowed by the session network policy). Needs OEM service information for test procedures and specifications. Do not quote pressure or resistance values: they are vehicle-specific.'
- id: C10
  text: Với nhóm rò rỉ khí nạp, có thể xác nhận bằng thử khói (smoke test) kết hợp đọc fuel trim; với nhóm cơ khí, xác nhận bằng đo áp suất nén hoặc thử độ lọt khí (leak-down).
  category: diagnostic-procedure
  sources: []
  status: unverified
  feature_id: null
  verified_by: ''
  verified_on: null
  notes: 'No source read: WebFetch to ww2.arb.ca.gov and www.law.cornell.edu failed on 2026-11-06 (host not allowed by the session network policy). Needs OEM service information or textbook.'
- id: C11
  text: Quy định OBD-II của CARB/EPA áp dụng cho xe được chứng nhận để bán tại Mỹ; với xe bán tại Việt Nam, cần đối chiếu tài liệu của hãng cho đúng thị trường, đời xe và động cơ.
  category: general-knowledge
  sources: []
  status: unverified
  feature_id: null
