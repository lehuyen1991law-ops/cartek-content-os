  notes: 'No source read: WebFetch to ww2.arb.ca.gov and www.law.cornell.edu failed on 2026-11-06 (host not allowed by the session network policy). Needs the applicability clause of 13 CCR 1968.2 / 40 CFR 86.1806 (scope of the US rules).'
