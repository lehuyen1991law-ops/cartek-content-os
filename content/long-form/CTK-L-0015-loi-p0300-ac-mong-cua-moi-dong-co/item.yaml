problem: Thợ gặp P0300 thường thay bugi, bô-bin hoặc xóa mã ngay mà chưa xác định nguyên nhân, nên lỗi quay lại và tốn phụ tùng.
takeaway: 'P0300 chỉ báo ECU phát hiện bỏ máy, không phải nguyên nhân: đọc freeze frame và dữ liệu trực tiếp, khoanh vùng nhóm nguyên nhân bằng phép thử xác nhận rồi mới thay phụ tùng; xóa mã không sửa được lỗi.'
