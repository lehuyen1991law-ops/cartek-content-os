# Quality-control policy for gates G1-G8 (scripts/qc_content.py).
# Text patterns are matched against a lower-cased, accent-stripped copy of the text
# ("Xóa lỗi" -> "xoa loi"), so write them WITHOUT Vietnamese accents.
# Text inside HTML comments (<!-- ... -->) is ignored: template guidance lives there.

gates:
  G1: "Source data and metadata validation"
  G2: "Audience and topic relevance"
  G3: "Research completeness and factual accuracy"
  G4: "Script coherence, clarity and retention quality"
  G5: "Automotive technical and safety review"
  G6: "SEO package completeness"
  G7: "Production handoff readiness"
  G8: "Publishing metadata validation"

# --- Approval rules (who must sign off on the CURRENT content fingerprint) ---------
approval:
  # Independent judgment reviews required in addition to the automated run.
  judgment_reviews:
    - role: qc
      gates: [G2, G4, G6, G7]
      reviewer_types: [agent, human]
    - role: technical
      gates: [G3, G5]
      reviewer_types: [agent, human]
  # When must the technical review be done by a qualified HUMAN?
  #   safety_flagged = only when safety.flags is not empty (minimum required by the brief)
  #   always         = every item (recommended once a technical reviewer is assigned)
  human_technical_review: safety_flagged
  # A human editor must record an editorial PASS before approval (publishing is public).
  require_human_final_signoff: true

# --- G2 ------------------------------------------------------------------------------
brief_required_sections: ["Audience", "Problem", "Takeaway", "Angle", "Scope", "Risks"]

# --- G3 ------------------------------------------------------------------------------
min_claims: 1
# A VERIFIED claim needs at least one source of an accepted type for its category.
claim_source_requirements:
  obd-standard: [standard, regulation, textbook, oem-service-information, manufacturer-documentation]
  dtc-definition: [standard, oem-service-information, textbook, manufacturer-documentation]
  manufacturer-specific: [oem-service-information, oem-tsb, manufacturer-documentation, hands-on-test]
  vehicle-specific: [oem-service-information, oem-tsb, hands-on-test]
  diagnostic-procedure: [oem-service-information, oem-tsb, standard, textbook, hands-on-test, manufacturer-documentation]
  cartek-feature: [cartek-product-documentation, hands-on-test]
  safety: [oem-service-information, regulation, standard, textbook, manufacturer-documentation]
  general-knowledge: [standard, regulation, oem-service-information, oem-tsb, textbook, trade-publication, manufacturer-documentation, expert-interview, hands-on-test]
  market-news: [news, trade-publication, regulation, manufacturer-documentation, cartek-product-documentation]
research_required_sections: ["Research question", "Findings", "Standard vs manufacturer-specific", "Open questions"]

# --- G4 ------------------------------------------------------------------------------
min_hook_candidates: 3
min_outline_items: {long-form: 3, short: 2}
min_segments: {long-form: 4, short: 2}
brand_tagline: "Cartek - Check your car"

# --- G5 ------------------------------------------------------------------------------
# Wording that implies clearing a code repairs the vehicle: always FAIL.
banned_patterns:
  # Matched against text with punctuation and line breaks turned into spaces, so
  # "Xóa lỗi... là xong!" and "xóa mã lỗi P0300 bằng máy là xe chạy ngon" are caught.
  - pattern: 'xoa (ma loi|ma|loi|den( bao loi| check engine)?)( [a-z0-9]+){0,6} (la|thi|se|de|cho) (xe )?(xong|het|sua|sua duoc|khac phuc|het benh|khoi|on|het loi|binh thuong|chay ngon|ngon)\b'
    reason: "Implies clearing a fault code repairs the fault."
  - pattern: '(tat|reset) (den|ma|loi)( [a-z0-9]+){0,6} (la|thi|se|de|cho) (xe )?(xong|het|sua|khac phuc|khoi|on|het loi|binh thuong|chay ngon)\b'
    reason: "Implies turning off the warning lamp repairs the fault."
  - pattern: 'clear(ing|ed)? (the )?(code|codes|dtc|dtcs|light|lamp)( [a-z0-9]+){0,4} (fix|fixes|fixed|repair|repairs|solve|solves|cure|cures)'
    reason: "Implies clearing a fault code repairs the fault."
# A banned phrase inside a sentence that also contains one of these markers is treated as
# myth-debunking ("Nhiều người tưởng xóa lỗi là xong, nhưng...") and reported for review instead.
# Kept specific on purpose: a bare "không" is too common and would let banned wording through.
debunk_markers: ['khong phai', 'khong dung', '\bla sai\b', 'sai lam', 'lam tuong', 'tuong rang', 'nguoi tuong', 'nghi rang', 'hieu lam', 'chua chac', '\bmyth\b']
# Wording a reviewer must look at (reported as warnings, never auto-passed silently).
review_patterns:
  - pattern: '100 ?%'
    reason: "Absolute certainty claim."
  - pattern: '\b(chac chan|dam bao|tuyet doi|vinh vien)\b'
    reason: "Guarantee wording; confirm it is supported."
  - pattern: '\b(tat ca|moi) (cac )?(dong |loai |hang )?xe\b'
    reason: "Possible all-vehicle compatibility claim."
  - pattern: 'khong can (den |ra )?(tho|garage|gara)'
    reason: "Tells viewers they do not need a professional; check safety."
# Mentioning code clearing requires a caveat that it does not fix the cause.
clear_codes_mentions: ['xoa (ma loi|ma|loi)\b', 'clear (code|dtc)', 'reset (den|loi|ma)']
clear_codes_caveat_markers:
  - 'khong (sua|khac phuc|giai quyet)'
  - '(loi|den) (se )?(sang|bao|xuat hien) lai'
  - 'nguyen nhan (van|con|goc)'
  - 'does not (fix|repair)'
# Naming Cartek in a segment (VO, ON-SCREEN, SAFETY, VISUAL) needs a cartek-feature claim, except
# the brand line (brand_tagline) and these brand marks: a logo, the brand name as a channel/brand
# and the end screen are not capability statements. Patterns are matched on normalized text, one
# clause at a time (clauses end at . ; ! ? , or a line break; a colon does NOT end a clause).
# "(?! 2)" keeps "logo cartek 2 ..." (the product) subject to the rule. A mark is exempt only when
# the clause ends right after it or continues with one of brand_mark_followers (placement words):
# "Logo Cartek; màn hình kết thúc Cartek với video liên quan" passes, "Thương hiệu Cartek chẩn
# đoán được mọi xe" and "Logo Cartek: đọc freeze frame mọi xe" still FAIL.
brand_mark_mentions:
  - '\blogo cartek\b(?! 2)'
  - '\bcartek logo\b'
  - '\b(thuong hieu|nhan hieu|kenh|dong chu) cartek\b(?! 2)'
  - '\bman hinh ket thuc cartek\b(?! 2)'
  - '\bend screen cartek\b(?! 2)'
brand_mark_followers: ['voi', 'va', 'ben', 'kem', 'cung', 'o', 'tren', 'duoi', 'goc', 'phia', 'nam', 'hien', 'xuat hien', 'mo dan', 'nho']
# DTC codes in the script must appear in the claim register.
dtc_pattern: '\b[PBCU][0-3][0-9A-F]{3}\b'
# Manufacturer-controlled DTC ranges (SAE J2012 / ISO 15031-6; verify against the standard).
manufacturer_specific_dtc_patterns: ['^P1', '^P3[0-3]', '^[BCU][12]']
# Terms that suggest a hazardous topic. Detected topics must be flagged
# (safety.flags -> qualified human review) or dismissed with a rationale.
safety_terms:
  high-voltage: ['cao ap', 'dien ap cao', 'high voltage', '\bxe dien\b', 'hybrid', '\bpin (xe|cao ap|lithium)\b', '\b(ev|phev|bev)\b', 'plug in']
  brakes: ['\bphanh\b', '\babs\b', '\bepb\b', 'ma phanh', '\b(dau|ma|dia|heo|be) thang\b', '\bthang tay\b']
  steering: ['vo lang', 'tro luc lai', '\beps\b', 'goc lai', 'thuoc lai', 'tay lai', 'rotuyn', 'thanh giang']
  airbag-srs: ['tui khi', '\bsrs\b', 'airbag', 'cang dai']
  fuel-system: ['ap suat (nhien lieu|xang)', '(ong|duong) (xang|dau|nhien lieu)', 'bom (xang|nhien lieu)', 'xa ap', 'thao kim phun', 'ro ri (xang|nhien lieu)', 'dong ho (do )?ap suat']
  lifting: ['kich xe', 'con doi', 'cau nang', 'nang xe', 'chui (vao )?gam', 'ke xe', 'kich nang', 'gam xe']
  battery-12v: ['ac quy', 'cau binh', 'thao cuc', 'binh dien', 'kich binh']
  hot-or-moving-parts: ['nuoc lam mat nong', 'nap ket nuoc', 'quat (ket nuoc|lam mat)', 'day curoa', '(dong co|may) dang (chay|no|hoat dong)', '\bno may\b', 'ong xa nong']
  adas: ['\badas\b', 'radar', 'can chinh camera']

# Placeholder wording that must never reach viewers (script narration/on-screen text and SEO
# fields). Matched like the other patterns (accent-free, lower case). Keep '\[todo' in the list.
draft_markers: ['\[todo', '\btodo\b', '(cho|chua|can) xac minh', 'ban nhap', 'dien sau', '\btbd\b', '\bxxx\b', '\?\?\?', 'lorem ipsum', '\bplaceholder\b']

# --- G6 ------------------------------------------------------------------------------
min_title_candidates: 3
min_tags: 3
min_thumbnail_concepts: {long-form: 2, short: 1}
seo_required_sections: ["Search intent", "Keyword notes", "Title rationale", "Publishing checklist"]
# Promises about performance that cannot be backed by evidence: FAIL.
performance_claim_patterns:
  - '\bctr\b'
  - '(len|lot|vao) top'
  - 'trieu (view|luot xem)'
  - '\bviral\b'
  - 'top 1\b'
  - 'chac chan (duoc )?(de xuat|len xu huong)'
